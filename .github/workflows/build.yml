name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      
      - run: npm ci
      
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=research-workspace
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure production hostname is attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const projectName = 'research-workspace';
          const domain = 'pcf.antimaterie.ro';
          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${projectName}`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json'
          };

          async function request(path = '', options = {}) {
            const response = await fetch(`${baseUrl}${path}`, {
              ...options,
              headers: { ...headers, ...options.headers }
            });
            const payload = await response.json();
            if (!response.ok || !payload.success) {
              throw new Error(JSON.stringify(payload.errors || payload));
            }
            return payload.result;
          }

          const project = await request();
          if (!project.domains.includes(domain)) {
            console.log(`Attaching ${domain} to ${projectName}`);
            await request('/domains', {
              method: 'POST',
              body: JSON.stringify({ name: domain })
            });
          }

          let customDomain;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            customDomain = await request(`/domains/${domain}`);
            console.log(`${domain} status: ${customDomain.status}`);
            if (customDomain.status === 'active') break;
            if (['blocked', 'error'].includes(customDomain.status)) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }

          if (customDomain.status !== 'active') {
            throw new Error(`${domain} did not become active (status: ${customDomain.status})`);
          }
          NODE
